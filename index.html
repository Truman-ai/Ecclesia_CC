<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7ea">
<title>에클레시아 춘천</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="에클레시아 춘천">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#fdf7ea; --ink:#2c2013; --muted:#8a7f6c; --surface:#ffffff; --line:#ece2cc;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%;max-width:460px;min-height:100dvh;
    padding:calc(var(--safe-t) + 56px) 24px calc(var(--safe-b) + 32px);
    display:flex;flex-direction:column;align-items:center;
  }
  .hero{width:128px;height:128px;margin-bottom:20px;border-radius:30px;overflow:hidden;
    box-shadow:0 10px 26px -10px rgba(60,40,10,.35)}
  .hero img{width:100%;height:100%;display:block;object-fit:cover}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;text-align:center}
  .tagline{font-size:13px;color:var(--muted);letter-spacing:.04em;margin-bottom:46px}
  nav{width:100%;display:flex;flex-direction:column;gap:14px}
  .card{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:16px 18px;border-radius:18px;background:var(--surface);
    border:1px solid var(--line);text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card:active{transform:scale(.98)}
  .card .badge{
    width:46px;height:46px;border-radius:14px;flex:none;
    display:grid;place-items:center;font-size:21px;
  }
  .card .text{flex:1;min-width:0}
  .card .label{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .card .sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .card .chev{color:var(--muted);font-size:20px;flex:none}
  footer{margin-top:auto;padding-top:40px;font-size:11px;color:var(--muted);opacity:.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="./logo-mark.png" alt="에클레시아 춘천 로고"></div>
  <h1>에클레시아 춘천</h1>
  <div class="tagline">ECCLESIA CHUNCHEON</div>

  <nav>
    <a class="card" href="./hymnal.html">
      <div class="badge" style="background:#bcc65940">🎵</div>
      <div class="text">
        <div class="label">찬송가</div>
      </div>
      <div class="chev">›</div>
    </a>
    <a class="card" href="./schedule.html">
      <div class="badge" style="background:#ff842c33">🗓️</div>
      <div class="text">
        <div class="label">일정</div>
      </div>
      <div class="chev">›</div>
    </a>
    <a class="card" href="./chart.html">
      <div class="badge" style="background:#80893f33">📊</div>
      <div class="text">
        <div class="label">차트</div>
      </div>
      <div class="chev">›</div>
    </a>
  </nav>

  <footer>에클레시아 춘천</footer>
</div>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
