<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7ea">
<title>에클레시아 춘천 찬송가</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="춘천 찬송가">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#faf9f7; --surface:#ffffff; --ink:#1c1b19; --muted:#7a756c;
    --line:#e7e3db; --accent:#1e3a8a; --refrain:#c0392b;
    --scale:1;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  html[data-theme="dark"]{
    --bg:#0f1115; --surface:#171a20; --ink:#e9e6e0; --muted:#9aa0aa;
    --line:#2a2e37; --accent:#93b4ff; --refrain:#ff8a80;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  /* ---------- top bar ---------- */
  .bar{
    position:sticky;top:0;z-index:10;background:var(--bg);
    padding:calc(var(--safe-t) + 12px) 14px 12px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .bar .brandmark{width:30px;height:30px;flex:none;border-radius:8px}
  .bar h1{font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .iconbtn{
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
    font-size:16px;flex:none;border:1px solid var(--line);background:var(--surface);
  }
  .bar .iconbtn.wide{width:auto;padding:0 12px;font-size:14px;font-weight:600}

  /* ---------- list view ---------- */
  .search{padding:12px 14px 4px}
  .search input{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:16px;outline:none;
  }
  .search input:focus{border-color:var(--accent)}
  .list{padding:8px 14px calc(var(--safe-b) + 28px);list-style:none}
  .item{
    display:flex;align-items:baseline;gap:14px;width:100%;text-align:left;
    padding:15px 12px;border-bottom:1px solid var(--line);
  }
  .item:active{background:var(--surface)}
  .item .num{
    font-size:15px;font-weight:700;color:var(--accent);
    min-width:2.4em;text-align:right;flex:none;font-variant-numeric:tabular-nums;
  }
  .item .ttl{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .item .ref{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}

  /* ---------- read view ---------- */
  .read{padding:22px 20px calc(var(--safe-b) + 120px);flex:1}
  .read .head{margin-bottom:22px}
  .read .head .kicker{font-size:14px;color:var(--accent);font-weight:700}
  .read .head h2{font-size:calc(24px * var(--scale));font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .read .head .bref{font-size:13px;color:var(--muted);margin-top:4px}
  .stanza{margin:0 0 26px}
  .stanza .lbl{
    font-size:calc(14px * var(--scale));font-weight:700;color:var(--muted);
    margin-bottom:4px;
  }
  .stanza p{font-size:calc(18px * var(--scale));white-space:pre-line;letter-spacing:-.01em}
  .stanza.refrain .lbl{color:var(--refrain)}
  .stanza.refrain p{color:var(--refrain)}
  .stanza.refrain{padding-left:14px;border-left:3px solid var(--refrain)}

  /* ---------- read: bottom action bar ---------- */
  .actions{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    max-width:640px;margin:0 auto;
    padding:10px 14px calc(var(--safe-b) + 12px);
    background:var(--bg);border-top:1px solid var(--line);
    display:flex;gap:10px;align-items:center;
  }
  .actions .nav{
    width:46px;height:46px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none;
  }
  .actions .nav:disabled{opacity:.35}
  .actions .present{
    flex:1;height:46px;border-radius:12px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:700;display:grid;place-items:center;letter-spacing:.02em;
  }
  html[data-theme="dark"] .actions .present{color:#0f1115}

  /* ---------- present view ---------- */
  .present-view{
    position:fixed;inset:0;z-index:100;background:#08090c;color:#f2efe9;
    display:flex;flex-direction:column;
  }
  .present-view.light{background:#fbfaf7;color:#1c1b19}
  .present-view .pbar{
    display:flex;align-items:center;gap:12px;
    padding:calc(var(--safe-t) + 10px) 16px 8px;font-size:13px;color:inherit;opacity:.75;
  }
  .present-view .pbar .mid{flex:1;text-align:center;font-variant-numeric:tabular-nums}
  .present-view .pbar button{font-size:18px;opacity:.9}
  .pstage{
    flex:1;display:grid;place-items:center;padding:16px 22px;text-align:center;
    position:relative;overflow:hidden;
  }
  .pstage .pcontent{max-width:100%}
  .pstage .plabel{
    font-size:clamp(13px,4vw,18px);font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;opacity:.55;margin-bottom:18px;
  }
  .present-view:not(.light) .pstage .plabel.refrain{color:#ff8a80;opacity:.85}
  .present-view.light .pstage .plabel.refrain{color:#c0392b;opacity:.9}
  .pstage p{
    font-size:calc(clamp(22px,7.4vw,40px) * var(--scale));
    font-weight:700;line-height:1.55;white-space:pre-line;letter-spacing:-.01em;
    word-break:keep-all;
  }
  .present-view:not(.light) .pstage p.refrain{color:#ff9d94}
  .present-view.light .pstage p.refrain{color:#c0392b}
  .ptap{position:absolute;inset:0;display:flex}
  .ptap span{flex:1}
  .phint{
    text-align:center;font-size:12px;opacity:.4;
    padding:0 16px calc(var(--safe-b) + 14px);
  }
  .dots{display:flex;gap:6px;justify-content:center;padding:6px 0 2px;flex-wrap:wrap}
  .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25}
  .dots i.on{opacity:.9}

  .hidden{display:none !important}
  @media (min-width:641px){
    body{padding:0}
    .app{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =========================================================================
   에클레시아 춘천 찬송가  —  단일 파일 앱
   데이터: 자체 제작 찬송가집 (PDF에서 옮김)
   구조: { n:번호, title:제목, ref:성구|null,
           blocks:[ {type:'verse'|'refrain', label, text} ] }
   'text' 안의 줄바꿈(\n)이 화면에서 그대로 줄바꿈됩니다.
   ========================================================================= */
const HYMNS = [
  {
    n:1, title:"주 하나님 지으신 모든 세계", ref:null,
    blocks:[
      {type:'verse', label:"1절", text:"주 하나님 지으신 모든 세계\n내 마음 속에 그리어 볼 때\n하늘의 별 울려 퍼지는 뇌성\n주님의 권능 우주에 찼네"},
      {type:'verse', label:"2절", text:"숲속이나 험한 산골짝에서\n지저귀는 저 새소리들과\n고요하게 흐르는 시냇물은\n주님의 솜씨 노래하도다"},
      {type:'verse', label:"3절", text:"주 하나님 독생자 아낌없이\n우리를 위해 보내주셨네\n십자가에 피 흘려 죽으신 주\n내 모든 죄를 대속하셨네"},
      {type:'verse', label:"4절", text:"내 주 예수 세상에 다시 올 때\n저 천국으로 날 인도하리\n나 겸손히 엎드려 경배하며\n영원히 주를 찬양하리라"},
      {type:'refrain', label:"후렴", text:"주님의 높고 위대하심을 내 영혼이 찬양하네\n주님의 높고 위대하심을 내 영혼이 찬양하네"}
    ]
  },
  {
    n:2, title:"주의 진리 위해", ref:null,
    blocks:[
      {type:'verse', label:"1절", text:"왕의 군사들아 그의 깃발을 하늘 높이 들고서\n그의 나라 위해 용맹스럽게 찬송하며 나가세"},
      {type:'verse', label:"2절", text:"그리스도 은혜 안에서 강한 하나님의 군대여\n함께 하늘의 부름 받았으니 찬송하며 나가세"},
      {type:'verse', label:"3절", text:"보좌 위에 계신 영광의 주님 어서 오시옵소서\n주의 나라 이 땅 위에 임하리 승리하신 왕의 왕"},
      {type:'refrain', label:"후렴", text:"앞으로 행진해 그리스도의 군사로\n주님과 함께 싸우면 함께 통치하리라"}
    ]
  },
  {
    n:3, title:"전능 왕 오셔서", ref:null,
    blocks:[
      {type:'verse', label:"1절", text:"전능왕 오셔서 주 이름 찬송케 하옵소서\n영광과 권능의 성부여 오셔서\n우리를 다스려 주옵소서"},
      {type:'verse', label:"2절", text:"보좌에 앉으신 거룩한 성자여 도우소서\n택하신 백성들 이기게 하소서\n처음과 나중인 주 예수여"},
      {type:'verse', label:"3절", text:"위로의 주 성령 우리를 도우사\n그의 나라 그 의를 위하여\n하나님 자녀의 형상을 온전히 이루소서"}
    ]
  },
  {
    n:4, title:"주여 나를 가르쳐", ref:null,
    blocks:[
      {type:'verse', label:"1절", text:"주여 나를 가르쳐 주 일꾼 되게 하소서\n주의 도를 보이사 주의 길 가도록\n일꾼들이 없으며 기도 부족하니\n내 맘 녹여 주셔서 일꾼 만드소서"},
      {type:'verse', label:"2절", text:"주여 나를 가르쳐 주의 뜻 행케 하소서\n주의 의와 진리를 가르쳐 주소서\n나의 믿음 지키고 면류관 받도록\n달려갈 길 마치고 주 앞에 서겠네"}
    ]
  },
  {
    n:5, title:"시온성과 같은 교회", ref:null,
    blocks:[
      {type:'verse', label:"1절", text:"시온성과 같은 교회 그의 영광 한없다\n허락하신 말씀대로 주가 친히 세웠다\n반석 위에 세운 교회 흔들 자가 누구랴\n모든 원수 에워싸도 아무 근심 없도다"},
      {type:'verse', label:"2절", text:"생명샘이 솟아나와 모든 백성 마시니\n언제든지 흘러넘쳐 부족함이 없도다\n이런 물이 흘러가니 목마를 자 누구랴\n주의 은혜 풍족하여 넘치고도 넘친다"}
    ]
  },
  {
    n:6, title:"너의 하나님 여호와가", ref:"습 3:17",
    blocks:[
      {type:'verse', label:"", text:"너의 하나님 여호와가\n너의 가운데 계시니\n그는 구원을 베푸실 전능자\n전능자시라\n그가 너로 인하여\n기쁨을 이기지 못하시며\n너를 잠잠히 사랑하시며\n즐거이 부르며 기뻐 기뻐하시리라\n즐거이 부르며 기뻐 기뻐하시리라"}
    ]
  },
  {
    n:7, title:"참 놀라운 왕이 계시네", ref:null,
    blocks:[
      {type:'verse', label:"1절", text:"참 놀라운 왕이 계시네\n오직 한 분 그리스도\n온 세상이 주 떠나가도\n나에게는 귀중한 주"},
      {type:'refrain', label:"후렴", text:"예수는 나의 힘 참 평안\n주님께 찬양을 드리네\n참 놀라운 나의 왕 예수\n오 예수 나의 구주"},
      {type:'verse', label:"2절", text:"나의 전부 기뻐드리네\n날 사랑하시는 왕께\n인자하신 그 사랑 받아\n나 즐거이 주 섬기네"},
      {type:'verse', label:"3절", text:"왕의 말씀 진실하시니\n믿고 의지하면서\n나 승리의 길 따라가리\n즐거우나 괴로우나"},
      {type:'verse', label:"4절", text:"나의 인생 내 모든 삶을\n왕이 주관하시오니\n주 안에서 쉬는 내 영혼\n왕의 나라 맞이하리"}
    ]
  },
  {
    n:8, title:"여기에 모인 우리", ref:"엡 6:23",
    blocks:[
      {type:'verse', label:"1절", text:"여기에 모인 우리\n주의 은총 받은 자여라\n주께서 이 자리에 함께 계심을 아노라\n언제나 주님만을\n찬양하며 따라가리니\n시련을 당할 때도\n함께 계심을 믿노라\n이 믿음 안에 거하라\n은혜 안에 강하라\n어두운 밤에도 주의 밝은 빛\n인도하여 주신다"},
      {type:'verse', label:"2절", text:"여기에 모인 우리\n사랑받는 주의 자녀라\n우리의 몸과 마음을 모두 주님께 드리네\n기도와 말씀으로\n나를 매일 새롭게 하리\n때로는 넘어져도\n최후 승리를 믿노라\n평안과 믿음 산 소망\n변함없는 주 사랑\n믿음의 선한 싸움 싸우라\n주가 지켜 주신다"}
    ]
  },
  {
    n:9, title:"십자가를 질 수 있나", ref:null,
    blocks:[
      {type:'verse', label:"1절", text:"십자가를 질 수 있나 주가 물어보실 때\n죽기까지 따르오리 저들 대답하였다"},
      {type:'refrain', label:"후렴", text:"우리의 심령 주의 것이니\n당신의 형상 만드소서\n주 인도 따라 살아갈 동안\n사랑과 충성 늘 바치 오리라 아멘"},
      {type:'verse', label:"2절", text:"너는 기억하고 있나 구원받은 강도를\n저가 회개하였을 때 낙원 허락 받았다"},
      {type:'verse', label:"3절", text:"주께 내 혼 맡기겠나 최후 승리 믿으며\n걱정 근심 어둔 그늘 너를 둘러 덮을 때"},
      {type:'verse', label:"4절", text:"이런 일 다 할 수 있나 주가 물어보실 때\n용감한 자 옛날처럼 선뜻 대답하리라"}
    ]
  },
  {
    n:10, title:"지난 이레 동안에", ref:"사 66:23",
    blocks:[
      {type:'verse', label:"1절", text:"지난 이레 동안에 주님 인도했으니\n주의 상에 모여서 감사 찬송합니다\n기쁜 하늘 잔치에 참여하게 하소서\n가장 복된 이 날은 하늘 안식 표로다"},
      {type:'verse', label:"2절", text:"유월절 어린 양 누룩 없는 떡이라\n이 잔은 그 피로 세운 새 언약이니\n이를 마실 때마다 주를 기억하리라\n주님 오실 때까지 그의 죽음 전하리"},
      {type:'verse', label:"3절", text:"주의 상에 모여서 주의 절기 지키네\n옛사람을 벗고서 묵은 누룩 버리네\n부활 승천하신 주 우리 안에 사시네\n하나님의 제사장 우린 그의 집이라 아멘"}
    ]
  },
  {
    n:11, title:"영광스런 주님의 상", ref:null,
    blocks:[
      {type:'verse', label:"1절", text:"영광스런 주님의 상에 우리는 초대 받았네\n유월절 어린 양의 피 새 언약을 이루셨도다\n할렐루야 할렐루야 영광스런 주의 상\n할렐루야 찬양하네 새 사람을 입고 기뻐해"},
      {type:'verse', label:"2절", text:"영과 진리로 예배하라 실제이신 주님의 상\n유월절 어린 양의 피 새 언약을 이루셨도다\n할렐루야 할렐루야 영광스런 주의 상\n할렐루야 찬양하네 주님 속히 오시옵소서"}
    ]
  },
  {
    n:12, title:"값비싼 향유를", ref:"눅 7:46",
    blocks:[
      {type:'verse', label:"1절", text:"값비싼 향유를 주께 드린 막달라 마리아 본받아서\n향기론 산 제물 주님께 바치리\n사랑의 주 내 주님께"},
      {type:'verse', label:"2절", text:"향기론 제물로 내려오사 자신을 버리신 그리스도\n그 향기 취하여 날마다 가까이\n사랑의 주 내 주님께"},

/* ---------- 설정 (localStorage) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let theme  = store.get('hj_theme', (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
let scale  = store.get('hj_scale', 1);
let pLight = store.get('hj_present_light', false);
applyTheme(); applyScale();

function applyTheme(){ document.documentElement.dataset.theme = theme; }
function applyScale(){ document.documentElement.style.setProperty('--scale', scale); }
function clampScale(v){ return Math.min(1.8, Math.max(0.8, Math.round(v*100)/100)); }

/* ---------- 라우팅 ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(parts[0] === 'h' && parts[1]){
    return { view: parts[2]==='present' ? 'present' : 'read', n: parseInt(parts[1],10) };
  }
  return { view:'list' };
}
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);

/* ---------- 렌더 ---------- */
const app = document.getElementById('app');
let searchTerm = '';

function render(){
  const r = parseHash();
  releaseWakeLock();
  if(r.view === 'list')  return renderList();
  const hymn = HYMNS.find(x => x.n === r.n);
  if(!hymn){ go('#/'); return; }
  if(r.view === 'read')    return renderRead(hymn);
  if(r.view === 'present') return renderPresent(hymn);
}

function renderList(){
  // 검색창(input)은 여기서 한 번만 만들고, 타이핑할 때는 목록만 다시 그림.
  // (매 입력마다 input을 통째로 새로 만들면 한글 조합이 깨져 'ㄱㅏㄴㅏ'처럼 입력됨)
  app.innerHTML = `
    <div class="bar">
      <img class="brandmark" src="./logo-mark.png" alt="">
      <h1>에클레시아 춘천 찬송가</h1>
      <button class="iconbtn" id="themeBtn" aria-label="화면 밝기 전환">${theme==='dark'?'☀️':'🌙'}</button>
    </div>
    <div class="search">
      <input id="q" type="search" inputmode="search" placeholder="번호 또는 제목으로 찾기"
             autocomplete="off" value="${escapeAttr(searchTerm)}">
    </div>
    <div id="listWrap"></div>
  `;
  const qi = document.getElementById('q');
  qi.addEventListener('input', e=>{ searchTerm = e.target.value; renderListItems(); });
  if(searchTerm){ qi.focus(); const v=qi.value; qi.value=''; qi.value=v; }
  document.getElementById('themeBtn').onclick = ()=>{
    theme = theme==='dark'?'light':'dark'; store.set('hj_theme',theme); applyTheme();
    document.getElementById('themeBtn').textContent = theme==='dark'?'☀️':'🌙';
  };
  renderListItems();
}

function renderListItems(){
  const q = searchTerm.trim().toLowerCase();
  const filtered = HYMNS.filter(h=>{
    if(!q) return true;
    return String(h.n) === q || String(h.n).includes(q) || h.title.toLowerCase().includes(q);
  });
  const wrap = document.getElementById('listWrap');
  wrap.innerHTML = filtered.length ? `<ul class="list">${filtered.map(h=>`
      <li><button class="item" data-n="${h.n}">
        <span class="num">${h.n}</span>
        <span class="ttl">${escapeHtml(h.title)}${h.ref?`<span class="ref">${escapeHtml(h.ref)}</span>`:''}</span>
      </button></li>`).join('')}</ul>`
      : `<div class="empty">검색 결과가 없습니다</div>`;
  wrap.querySelectorAll('.item').forEach(b=>{
    b.onclick = ()=> go('#/h/'+b.dataset.n);
  });
}

function renderRead(h){
  const idx = HYMNS.indexOf(h);
  const prev = HYMNS[idx-1], next = HYMNS[idx+1];
  app.innerHTML = `
    <div class="bar">
      <button class="iconbtn" id="backBtn" aria-label="목록으로">←</button>
      <h1>${h.n}장. ${escapeHtml(h.title)}</h1>
      <button class="iconbtn" id="minus" aria-label="글자 작게">가−</button>
      <button class="iconbtn" id="plus" aria-label="글자 크게">가＋</button>
      <button class="iconbtn" id="themeBtn" aria-label="화면 밝기 전환">${theme==='dark'?'☀️':'🌙'}</button>
    </div>
    <div class="read">
      <div class="head">
        <div class="kicker">${h.n}장</div>
        <h2>${escapeHtml(h.title)}</h2>
        ${h.ref?`<div class="bref">${escapeHtml(h.ref)}</div>`:''}
      </div>
      ${h.blocks.map(b=>`
        <div class="stanza ${b.type==='refrain'?'refrain':''}">
          ${b.label?`<div class="lbl">${escapeHtml(b.label)}</div>`:''}
          <p>${escapeHtml(b.text)}</p>
        </div>`).join('')}
    </div>
    <div class="actions">
      <button class="nav" id="navPrev" ${prev?'':'disabled'} aria-label="이전 찬송">‹</button>
      <button class="present" id="presentBtn">▶  띄우기</button>
      <button class="nav" id="navNext" ${next?'':'disabled'} aria-label="다음 찬송">›</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=> go('#/');
  document.getElementById('themeBtn').onclick = ()=>{
    theme = theme==='dark'?'light':'dark'; store.set('hj_theme',theme); applyTheme(); renderRead(h);
  };
  document.getElementById('minus').onclick = ()=>{ scale = clampScale(scale-0.1); store.set('hj_scale',scale); applyScale(); };
  document.getElementById('plus').onclick  = ()=>{ scale = clampScale(scale+0.1); store.set('hj_scale',scale); applyScale(); };
  document.getElementById('presentBtn').onclick = ()=> go('#/h/'+h.n+'/present');
  if(prev) document.getElementById('navPrev').onclick = ()=> go('#/h/'+prev.n);
  if(next) document.getElementById('navNext').onclick = ()=> go('#/h/'+next.n);
  window.scrollTo(0,0);
}

/* ---------- 띄우기 모드 ---------- */
function renderPresent(h){
  const slides = h.blocks;          // 절/후렴을 순서대로 한 장씩
  let i = 0;

  function draw(){
    const b = slides[i];
    content.innerHTML = `
      <div class="pcontent">
        ${b.label?`<div class="plabel ${b.type==='refrain'?'refrain':''}">${escapeHtml(b.label)}</div>`:''}
        <p class="${b.type==='refrain'?'refrain':''}">${escapeHtml(b.text)}</p>
      </div>`;
    mid.textContent = `${h.n}장 · ${i+1}/${slides.length}`;
    dots.innerHTML = slides.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
    fit();
  }
  function fit(){
    const p = content.querySelector('p'); if(!p) return;
    p.style.fontSize = '';
    let size = parseFloat(getComputedStyle(p).fontSize);
    const avail = stage.clientHeight - 24;
    let guard = 0;
    while(content.scrollHeight > avail && size > 13 && guard++ < 60){
      size -= 2; p.style.fontSize = size + 'px';
    }
  }
  function move(d){
    const ni = i + d;
    if(ni < 0 || ni >= slides.length) return;
    i = ni; draw();
  }

  app.innerHTML = `
    <div class="present-view ${pLight?'light':''}" id="pv">
      <div class="pbar">
        <button id="pExit" aria-label="닫기">✕</button>
        <div class="mid" id="pMid"></div>
        <button id="pLight" aria-label="화면 밝기 전환">${pLight?'🌙':'☀️'}</button>
      </div>
      <div class="pstage" id="pStage">
        <div id="pContent"></div>
        <div class="ptap"><span data-d="-1"></span><span data-d="1"></span></div>
      </div>
      <div class="dots" id="pDots"></div>
      <div class="phint">화면을 탭하면 다음 · 왼쪽 탭은 이전</div>
    </div>
  `;
  const pv = document.getElementById('pv');
  const stage = document.getElementById('pStage');
  const content = document.getElementById('pContent');
  const mid = document.getElementById('pMid');
  const dots = document.getElementById('pDots');
  draw();

  document.getElementById('pExit').onclick = ()=> go('#/h/'+h.n);
  document.getElementById('pLight').onclick = ()=>{
    pLight = !pLight; store.set('hj_present_light', pLight);
    pv.classList.toggle('light', pLight);
    document.getElementById('pLight').textContent = pLight?'🌙':'☀️';
  };
  const tap = stage.querySelector('.ptap');
  if(tap) tap.addEventListener('click', e=>{
    const t = e.target.closest('span'); if(!t) return;
    move(parseInt(t.dataset.d,10));
  });

  // 스와이프
  let sx=0, sy=0;
  stage.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  stage.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1);
  }, {passive:true});

  // 키보드 (PC/외부 리모컨)
  presentKeyHandler = e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); move(1); }
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); move(-1); }
    else if(e.key==='Escape'){ go('#/h/'+h.n); }
  };
  window.addEventListener('keydown', presentKeyHandler);

  presentResizeHandler = ()=> fit();
  window.addEventListener('resize', presentResizeHandler);
  window.addEventListener('orientationchange', presentResizeHandler);

  requestWakeLock();
}
let presentKeyHandler = null;
let presentResizeHandler = null;

/* ---------- 화면 꺼짐 방지 ---------- */
let wakeLock = null;
async function requestWakeLock(){
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function releaseWakeLock(){
  if(presentKeyHandler){ window.removeEventListener('keydown', presentKeyHandler); presentKeyHandler = null; }
  if(presentResizeHandler){ window.removeEventListener('resize', presentResizeHandler); window.removeEventListener('orientationchange', presentResizeHandler); presentResizeHandler = null; }
  try{ wakeLock && wakeLock.release(); }catch(e){}
  wakeLock = null;
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && parseHash().view === 'present') requestWakeLock();
});

/* ---------- util ---------- */
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }

/* ---------- 서비스 워커 등록 (http/https 에서만; file:// 로 열면 건너뜀) ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

render();
</script>
