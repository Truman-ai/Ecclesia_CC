<style>
  :root{
    --bg:#fdf7ea; --ink:#2c2013; --muted:#8a7f6c; --surface:#ffffff; --line:#ece2cc;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;touch-action:manipulation}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%;max-width:460px;min-height:100dvh;
    padding:calc(var(--safe-t) + 56px) 24px calc(var(--safe-b) + 32px);
    display:flex;flex-direction:column;align-items:center;
  }
  /* 로고 높이 = 제목 줄(30) + 간격(4) + 영문 줄(16) */
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:46px}
  .brand .hero{width:50px;height:50px;flex:none;display:block;object-fit:cover;border-radius:12px}
  h1{font-size:26px;line-height:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .tagline{font-size:13px;line-height:16px;color:var(--muted);letter-spacing:.04em}
  .notice{width:100%;display:flex;align-items:center;gap:10px;margin:-26px 0 14px;
    padding:11px 16px;border-radius:14px;background:#ff842c1f;border:1px solid #ff842c40;
    font-size:14px;font-weight:600;line-height:1.45;letter-spacing:-.01em}
  .notice .ico{flex:none;font-size:17px}
  .notice .msg{flex:1;min-width:0;white-space:pre-line}
  .notice[hidden]{display:none}
  .notice.empty{background:transparent;border-style:dashed;color:var(--muted)}
  .notice .edit{flex:none;font-size:12.5px;font-weight:700;color:var(--muted);padding:4px 8px;margin:-4px -8px -4px 0;
    background:none;border:none;font-family:inherit;cursor:pointer}
  .notice textarea{flex:1;min-width:0;font:inherit;color:inherit;background:var(--surface);
    border:1px solid #ff842c66;border-radius:10px;padding:8px 10px;resize:vertical;min-height:64px}
  .notice .btns{display:flex;flex-direction:column;gap:6px;flex:none}
  .notice .btns button{font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .notice .btns .save{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  nav{width:100%;display:flex;flex-direction:column;gap:14px}
  .card{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:16px 18px;border-radius:18px;background:var(--surface);
    border:1px solid var(--line);text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card:active{transform:scale(.98)}
  .card .badge{
    width:46px;height:46px;border-radius:14px;flex:none;
    display:grid;place-items:center;font-size:21px;
  }
  .card .text{flex:1;min-width:0}
  .card .label{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .card .label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .new{font-size:11px;font-weight:700;letter-spacing:0;color:#fff;background:#e5532d;
    border-radius:999px;padding:3px 8px;line-height:1.3}
  .card .sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .card .chev{color:var(--muted);font-size:20px;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img class="hero" src="./logo-mark.png" alt="">
    <div>
      <h1>에클레시아 춘천</h1>
      <div class="tagline">ECCLESIA CHUNCHEON</div>
    </div>
  </div>

  <!-- 공지: 관리자 로그인 상태(다른 페이지에서 로그인)면 '수정' 버튼이 보임. 비워서 저장하면 숨김 -->
  <div class="notice" id="notice" hidden></div>

  <nav>
    <a class="card" href="./hymnal.html" data-sec="hymnal" data-new-name="찬송">
      <div class="badge" style="background:#bcc65940">🎵</div>
      <div class="text">
        <div class="label">찬송가</div>

    </a>
    <a class="card" href="./word.html" data-sec="word">
      <div class="badge" style="background:#1e3a8a33">🎧</div>
      <div class="text">
        <div class="label">녹음</div>
      </div>

    </a>
    <a class="card" href="./schedule.html" data-sec="schedule">
      <div class="badge" style="background:#ff842c33">🗓️</div>
      <div class="text">

    </a>
    <a class="card" href="./news.html" data-sec="news">
      <div class="badge" style="background:#3e6fae33">📰</div>
      <div class="text">

    <a class="card" href="./chart.html" data-sec="chart">
      <div class="badge" style="background:#80893f33">📊</div>

</div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================================
   공지 — words 컬렉션의 'notice' 문서 { kind:'notice', text, seq:0 }
   문서가 아직 없으면 DEFAULT_NOTICE 를 보여줌. text 를 비워 저장하면 공지란 숨김.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAlhXqaMgI3phBuH7LaFI339TrPLQaqCWA",
  authDomain: "ecclesiacc-b33d8.firebaseapp.com",
  projectId: "ecclesiacc-b33d8",
  storageBucket: "ecclesiacc-b33d8.firebasestorage.app",
  messagingSenderId: "958593730476",
  appId: "1:958593730476:web:16cbcb1f9159027db3dc09"
};
const DEFAULT_NOTICE = "만일 우리가 성령으로 살면 또한 성령으로 행할찌니 (갈 5:25)";
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence().catch(()=>{});
const noticeRef = db.collection('words').doc('notice');

const box = document.getElementById('notice');
let noticeText = null, currentUser = null, editing = false;

noticeRef.onSnapshot(doc=>{
  noticeText = doc.exists ? (doc.data().text || '') : DEFAULT_NOTICE;
  if(!editing) renderNotice();
}, err=> console.error(err));
auth.onAuthStateChanged(u=>{ currentUser = u; if(!editing) renderNotice(); });

function renderNotice(){
  if(noticeText === null){ box.hidden = true; return; }
  if(!noticeText && !currentUser){ box.hidden = true; return; }
  box.hidden = false;
  box.classList.toggle('empty', !noticeText);
  box.innerHTML = `<span class="ico" aria-hidden="true">📢</span>
    <span class="msg">${escapeHtml(noticeText || '공지 없음')}</span>
    ${currentUser ? `<button class="edit" id="noticeEdit">✎ 수정</button>` : ''}`;
  if(currentUser) document.getElementById('noticeEdit').onclick = startEdit;
}

function startEdit(){
  editing = true;
  box.hidden = false; box.classList.remove('empty');
  box.innerHTML = `<span class="ico" aria-hidden="true">📢</span>
    <textarea id="noticeInput" rows="2" placeholder="비워서 저장하면 공지가 숨겨집니다">${escapeHtml(noticeText)}</textarea>
    <span class="btns"><button class="save" id="noticeSave">저장</button><button id="noticeCancel">취소</button></span>`;
  const input = document.getElementById('noticeInput');
  input.focus();
  document.getElementById('noticeCancel').onclick = ()=>{ editing = false; renderNotice(); };
  document.getElementById('noticeSave').onclick = async e=>{
    e.target.disabled = true;
    try{
      await noticeRef.set({ kind:'notice', text: input.value.trim(), seq: 0 });
      editing = false; renderNotice();
    }catch(err){ alert('저장 실패: ' + err.message); e.target.disabled = false; }
  };
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
<script src="./updates.js"></script>
<script>
/* 섹션별 '새 컨텐츠' 표시 (updates.js) */
let lastUpdated = null;
function renderNewTags(){
  if(!lastUpdated) return;
  document.querySelectorAll('.card[data-sec]').forEach(card=>{
    const label = card.querySelector('.label');
    let tag = label.querySelector('.new');
    if(hasNew(card.dataset.sec, lastUpdated)){
      if(!tag){ tag = document.createElement('span'); tag.className = 'new'; tag.textContent = newText(card.dataset.newName || label.firstChild.textContent.trim()); label.appendChild(tag); }
    } else if(tag) tag.remove();
  });
}
/* '새 찬송가가 있습니다!' / '새 녹음이 있습니다!' — 받침 있으면 '이', 없으면 '가' */
function newText(name){
  const c = name.charCodeAt(name.length - 1) - 0xAC00;
  const josa = (c >= 0 && c <= 11171 && c % 28) ? '이' : '가';
  return `새 ${name}${josa} 있습니다!`;
}
watchUpdates(updated=>{ lastUpdated = updated; initSeen(updated); renderNewTags(); });
// 섹션에 다녀와 '뒤로'로 돌아왔을 때(페이지 캐시 복원) 다시 확인
window.addEventListener('pageshow', renderNewTags);
window.addEventListener('storage', renderNewTags);
</script>
<script src="./sw-register.js"></script>
</body>
